name: ROADGUARD AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Syntax & Automated Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install PyTorch (CPU) & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Verify Python Syntax Across All Modules
        run: |
          python -m compileall -q .

      - name: Verify Clean Database Initialization
        run: |
          python init_db.py --reset

      - name: Run Pytest Test Suite
        env:
          ROADGUARD_ENV: test
          ROADGUARD_SECRET_KEY: ci-test-secret-key-32bytes-hex-ok
        run: |
          pytest tests/ -v
