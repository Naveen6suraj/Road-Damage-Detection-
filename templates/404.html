{% extends "base.html" %}

{% block title %}404 Not Found | ROADGUARD AI{% endblock %}

{% block content %}
<div class="panel-card" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Page Not Found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">{{ message or "The requested resource could not be found." }}</p>
    <a href="/" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
